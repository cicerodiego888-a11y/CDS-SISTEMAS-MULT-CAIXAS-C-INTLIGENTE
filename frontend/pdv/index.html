<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDS Sistemas - PDV</title>
    <link rel="icon" type="image/x-icon" href="/branding/favicon.ico">
    <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pdv.css">
    <link rel="stylesheet" href="/css/pdv-themes.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav id="sidebar" class="col-md-2 col-lg-2 d-md-block bg-dark sidebar">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-2" id="sidebar-brand">
                        <div id="sidebar-brand-content">
                            <img src="/branding/logo-oficial.png" alt="CDS Sistemas" class="img-fluid brand-sidebar-logo">
                            <small class="text-muted brand-sidebar-slogan">Inteligência para gerir, Tecnologia para crescer</small>
                        </div>
                        <div id="sidebar-modo-fiscal-bar" class="sidebar-modo-fiscal-bar sidebar-modo-fiscal-bar--on" title="Modo fiscal ativo"></div>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white active" href="#" data-page="pdv">
                                <i class="fas fa-shopping-basket"></i> Venda
                            </a>
                        </li>
                        <li class="nav-item" data-recurso="vendasEntrega">
                            <a class="nav-link text-white" href="#" data-page="entregas">
                                <i class="fas fa-motorcycle"></i> Entregas
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#" data-page="consulta">
                                <i class="fas fa-search-dollar"></i> Consulta de Preço
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#" data-page="clientes">
                                <i class="fas fa-users"></i> Clientes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#" data-page="caixa" title="Sangria, suprimento e fechamento">
                                <i class="fas fa-cash-register"></i> Caixa
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#" data-page="reimpressao">
                                <i class="fas fa-print"></i> Reimpressão de Cupom
                            </a>
                        </li>
                        <li class="nav-item" id="nav-nome-terminal-pdv" style="display:none">
                            <a class="nav-link text-white" href="#" data-page="nome-terminal-pdv">
                                <i class="fas fa-tag"></i> Nome deste PDV
                            </a>
                        </li>
                        <li class="nav-item" id="nav-config-rede-pdv" style="display:none">
                            <a class="nav-link text-warning" href="#" data-page="configuracao-rede">
                                <i class="fas fa-network-wired"></i> Configuração de Rede
                            </a>
                        </li>
                        <li class="nav-item" id="nav-abrir-erp" style="display:none">
                            <a class="nav-link text-info" href="/erp" data-modulo-externo="cds-erp" title="Abre o ERP sem encerrar a venda">
                                <i class="fas fa-building"></i> Abrir ERP
                            </a>
                        </li>
                        <li class="nav-item" id="nav-assinatura">
                            <a class="nav-link text-warning" href="/erp?page=licenca" data-modulo-externo="cds-erp" title="Renovar assinatura CDS">
                                <i class="fas fa-id-card"></i> Assinatura
                            </a>
                        </li>
                    </ul>

                    <div class="sidebar-footer">
                        <div class="text-white mb-2 small">
                            <i class="fas fa-user"></i> <span id="user-nome">Carregando...</span>
                            <br>
                            <small id="user-perfil" class="text-muted">-</small>
                            <small id="pdv-terminal-rotulo" class="d-block mt-1" style="display:none"></small>
                        </div>
                        <button class="btn btn-danger btn-sm w-100" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Sair
                        </button>
                    </div>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto col-lg-10 px-md-4 position-relative">
                <div id="page-content">
                    <div class="text-center p-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2">Carregando PDV...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="modal-container"></div>

    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="/shared/js/motor-preco-atacado.js"></script>
    <script src="/shared/js/tefFluxoPagamento.js"></script>
    <script src="/pdv/js/pdv-theme-manager.js"></script>
    <script src="/pdv/js/pdv-footer-widgets.js"></script>
    <script src="/pdv/js/pdv-venda-entrega.js"></script>
    <script src="/pdv/js/pdv-prestacao-entrega.js"></script>
    <script src="/pdv/js/pdv.js"></script>
    <script src="/pdv/js/pdv-appearance-panel.js"></script>
    <script src="/shared/js/nomeTerminalPdv.js"></script>
    <script src="/pdv/js/caixa.js"></script>
    <script src="/pdv/js/clientes.js"></script>
    <script src="/pdv/js/vendas.js"></script>
    <script src="/pdv/js/entregas.js"></script>
    <script src="/shared/js/AgentSDK.js"></script>
    <script src="/shared/js/cds-copiloto-widget.js"></script>
    <script src="/pdv/js/app.js"></script>
    <script>
        if (typeof initCdsCopilotoWidget === 'function') initCdsCopilotoWidget();
    </script>

    <div id="notification-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999; pointer-events: none;"></div>

    <footer style="position: fixed; bottom: 0; width: 100%; background: #111827; color: #9ca3af; text-align: center; padding: 6px; font-size: 12px; z-index: 1000;">
        &copy; <span data-brand="copyright">CDS Sistemas</span> — PDV (Frente de Caixa)
    </footer>
