<!-- Página de Categorias -->
<div class="container mt-4">
  <div id="categorias-page-shell"></div>
  <div class="mb-3 d-flex justify-content-between align-items-center gap-2">
    <div>
      <label for="filtro-tipo-categoria" class="form-label">Filtrar por tipo:</label>
      <select id="filtro-tipo-categoria" class="form-select" style="width: auto; display: inline-block;">
        <option value="">Todos</option>
        <option value="produto">Produto</option>
        <option value="despesa">Despesa</option>
      </select>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modal-categoria">Nova Categoria</button>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal-subcategoria">Nova Subcategoria</button>
    </div>
  </div>
  <table class="table table-bordered table-hover">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Tipo</th>
        <th>Descrição</th>
        <th>Estoque</th>
        <th>Comercial</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="categorias-tbody">
      <!-- Categorias serão carregadas aqui -->
    </tbody>
  </table>

  <div id="subcategorias-section">
    <hr>
    <h4>Subcategorias</h4>
    <table class="table table-bordered table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Categoria</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="subcategorias-tbody">
        <!-- Subcategorias serão carregadas aqui -->
      </tbody>
    </table>
  </div>
</div>



<!-- Modal Nova Categoria -->
<div class="modal fade" id="modal-categoria" tabindex="-1" aria-labelledby="modalCategoriaLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCategoriaLabel">Nova Categoria</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="categoria-id">
        <div class="mb-3">
          <label for="categoria-nome" class="form-label">Nome</label>
          <input type="text" id="categoria-nome" class="form-control">
        </div>
        <div class="mb-3">
          <label for="categoria-descricao" class="form-label">Descrição</label>
          <input type="text" id="categoria-descricao" class="form-control">
        </div>
        <div class="mb-3">
          <label for="categoria-tipo" class="form-label">Tipo</label>
          <select id="categoria-tipo" class="form-select">
            <option value="produto">Produto</option>
            <option value="despesa">Despesa</option>
          </select>
        </div>
        <div class="mb-3" id="area-padroes-categoria">
          <label class="form-label">Controle de estoque</label>
          <div class="d-flex flex-wrap gap-3 mb-2">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="categoria-padrao-estoque" id="categoria-estoque-controlado" value="1" checked>
              <label class="form-check-label" for="categoria-estoque-controlado">Controlado</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="categoria-padrao-estoque" id="categoria-estoque-nao-controlado" value="0">
              <label class="form-check-label" for="categoria-estoque-nao-controlado">Não controlado</label>
            </div>
          </div>
          <label class="form-label">Controle comercial</label>
          <div class="d-flex flex-wrap gap-3">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="categoria-padrao-comercial" id="categoria-comercial-padrao" value="PADRAO" checked>
              <label class="form-check-label" for="categoria-comercial-padrao">Padrão</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="categoria-padrao-comercial" id="categoria-comercial-alternativo" value="ALTERNATIVO">
              <label class="form-check-label" for="categoria-comercial-alternativo">Alternativo</label>
            </div>
          </div>
          <div class="form-text">Define apenas o valor inicial de produtos novos. Produtos já cadastrados não são alterados.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-success" id="btn-salvar-categoria">Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Nova Subcategoria -->
<div class="modal fade" id="modal-subcategoria" tabindex="-1" aria-labelledby="modalSubcategoriaLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalSubcategoriaLabel">Nova Subcategoria</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="subcategoria-categoria-id" class="form-label">Categoria</label>
          <select id="subcategoria-categoria-id" class="form-select"></select>
        </div>
        <div class="mb-3">
          <label for="subcategoria-nome" class="form-label">Nome da subcategoria</label>
          <input type="text" id="subcategoria-nome" class="form-control">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-success" id="btn-salvar-subcategoria">Salvar</button>
      </div>
    </div>
  </div>
</div>
<script src="js/subcategorias.js"></script>
